services:
  mysite:
    image: ${IMAGE:?IMAGE is required}
    pull_policy: always
    container_name: mysite
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
